<title>Office Besties</title>
<style>
:root{color-scheme:dark;--bg:#1a120d;--fg:#fff}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;font-family:system-ui,sans-serif}
svg{position:fixed;inset:0;width:100%;height:100%}
svg rect[width="1600"][height="900"]{pointer-events:none}
#guyhit{cursor:pointer}
.br{animation:br 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}

.bl{animation:bl 5s infinite;transform-box:fill-box;transform-origin:50% 50%}

.hd{animation:hd 6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes hd{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
.tl{animation:ty .34s ease-in-out infinite alternate}
.tr{animation:ty .34s ease-in-out .17s infinite alternate}
@keyframes ty{to{transform:translateY(3px)}}
.fw{animation:fw 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fw{50%{transform:rotate(4deg)}}
.hs{animation:hs 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes hs{50%{transform:rotate(2.5deg)}}
.tk{animation:tk 6s infinite both;transform-box:fill-box;transform-origin:50% 0;opacity:0}
@keyframes tk{0%{opacity:0;transform:scaleY(.1)}3%{opacity:1;transform:scaleY(1)}8%{transform:scaleY(.3)}13%{transform:scaleY(1)}18%{transform:scaleY(.4)}23%{transform:scaleY(.9)}28%{transform:scaleY(.3)}33%{transform:scaleY(1)}38%{transform:scaleY(.25)}42%{opacity:1;transform:scaleY(.8)}46%,100%{opacity:0;transform:scaleY(.1)}}
.sm{animation:sm 4.2s ease-out infinite both;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sm{0%{opacity:0;transform:translate(0,4px) scale(.7)}15%{opacity:.6}100%{opacity:0;transform:translate(5px,-18px) scale(1.25)}}
.pk{animation:pk 5s ease-in-out infinite}
@keyframes pk{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.lk{animation:lk 7s ease-in-out infinite}
@keyframes lk{0%,25%,100%{transform:translateX(0)}35%,55%{transform:translateX(-2.5px)}65%,85%{transform:translateX(2px)}}
.bw{animation:bw 6s ease-in-out infinite}
@keyframes bw{0%,60%,100%{transform:translateY(0)}68%,76%{transform:translateY(-2.5px)}}
.br2{animation:br2 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes br2{50%{transform:scale(1.02,1.07)}}
.zz{animation:zz 4s ease-out infinite both;transform-box:fill-box;transform-origin:0 100%}
@keyframes zz{0%{opacity:0;transform:translate(0,6px) scale(.6)}20%{opacity:.95}100%{opacity:0;transform:translate(-14px,-40px) scale(1.3)}}
.gl{animation:gl 5s ease-in-out infinite}
@keyframes gl{0%,100%{opacity:.7}45%{opacity:1}50%{opacity:.8}70%{opacity:.95}}
.sy{animation:sy 7s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sy{50%{transform:rotate(1.6deg)}}
#girlhit{cursor:pointer}
#gunHN.hold .fg{visibility:hidden}
#girlRhit{cursor:pointer}
#faceR .altf{display:none}
#faceR.on .altf{display:inline;animation:sly .3s ease-out both}
#faceR.on .bl,#faceR.on .brw,#faceR.on .lp,#faceR.on .tk{visibility:hidden}
#girlR.bald .hr,#girlR.bald .hs{visibility:hidden}
#girlR .shn{display:none}
#girlR.bald .shn{display:inline}
#tcl2{transform-box:fill-box;transform-origin:10% 100%}
#catHit{cursor:pointer}
#catG.awake .ce,#catG.awake .zz{display:none}
#catG .aw{display:none}
#catG.awake .aw{display:inline}
#catG.yawn .ey{display:none}
#catG.yawn .ce{display:inline}
.mw{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(.04)}
#catBi{transform-box:fill-box;transform-origin:10% 100%}
#faceL .altf{display:none}
#faceL.on .altf{display:inline}
#faceL.on .bl,#faceL.on .brw,#faceL.on .lp,#faceL.on .tk{visibility:hidden}
#faceL.on .altf{animation:sly .5s ease-out both}
@keyframes sly{from{opacity:0}to{opacity:1}}
.td,#tcl{transform-box:fill-box;transform-origin:50% 50%}
#doorhit{cursor:pointer}
.mE{transform-box:fill-box;transform-origin:50% 50%}
.mP,.mB{transition:transform .2s ease-out}
#mbi{transform-box:fill-box;transform-origin:18% 100%}
</style>
</head>

// ---- cat: click -> wakes, yawns, stretches, meows, goes back to sleep ----

// ---- talking gestures: only while that girl's mouth is moving ----

const TT=[0,.12,.26,.4,.54,.68,.82,.94,1];
const GL=[ // left girl's free arm: all gestures open outward / up, never across her belly (values are for the right arm; mirrored in use)
 {u:[0,-10,-14,-10,-14,-10,-6,0,0],f:[0,-70,-78,-66,-82,-68,-74,-20,0],h:[0,20,34,16,38,20,30,0,0]},      // palm-up offer
 {u:[0,-12,-12,-12,-12,-12,-8,0,0],f:[0,-120,-105,-122,-104,-120,-108,-30,0],h:[0,-10,10,-10,10,-10,5,0,0]}, // hand up beside shoulder, beating
 {u:[0,-6,-6,-6,-6,-6,-4,0,0],f:[0,-85,-68,-88,-66,-90,-72,-20,0],h:[0,-25,-25,-25,-25,-25,-12,0,0]},      // chops out to the side
 {u:[0,-8,-14,-8,-16,-8,-12,0,0],f:[0,-60,-90,-55,-95,-60,-85,-20,0],h:[0,35,-20,40,-25,35,-10,0,0]},      // twirling hand
 {u:[0,-4,-4,-4,-4,-4,-3,0,0],f:[0,-45,-42,-48,-40,-46,-42,-12,0],h:[0,35,-30,35,-30,35,-20,0,0]},        // quick hand flicks
 {u:[0,-6,-16,-20,-14,-8,-4,0,0],f:[0,-20,-70,-115,-95,-60,-30,-10,0],h:[0,10,20,30,20,0,0,0,0]}];       // big lift out and back
const GR=[ // right girl (upside down): arm swings out toward her friend
 {u:[0,14,26,12,28,10,20,6,0]},{u:[0,22,18,26,16,24,12,4,0]},{u:[0,8,30,6,24,10,28,8,0]},{u:[0,18,10,24,8,28,14,5,0]}];
function talker(mouthId,sel,gests,sg=1){
 const m=$('#'+mouthId),els=[...document.querySelectorAll(sel)];let last=-1,anims=[];
 const play=()=>{
  anims.forEach(a=>a.cancel());anims=[];
  if(Math.random()<.15)return;                                   // sometimes talks without gesturing
  let i;do{i=Math.floor(Math.random()*gests.length)}while(i===last&&gests.length>1);last=i;
  const g=gests[i],amp=R(.8,1.2),delay=R(80,320),dur=Math.min(R(1500,2500),2680-delay);
  els.forEach(el=>{const key=el.classList.contains('ua')?'u':el.classList.contains('fa')?'f':'h';
   if(!g[key])return;
   anims.push(el.animate(g[key].map((v,k)=>({offset:TT[k],easing:'ease-in-out',
     transform:`rotate(${(sg*(k&&k<TT.length-1?v*amp*R(.88,1.12):v)).toFixed(1)}deg)`})),{duration:dur,delay,fill:'both'}))})};
 return{start:play,m}}
{const L=talker('mouthL','#ppl .tkr',GL,-1),Rr=talker('mouthR','#armW',GR);
 L.start();L.m.addEventListener('animationiteration',L.start);
 Rr.m.addEventListener('animationiteration',Rr.start)}
// ---- door: click -> it creaks open, a long-haired bearded man peeks around it and asks "Is Logan in here?" ----
{const hit=$('#doorhit'),fx=$('#doorFx'),leaf=$('#leaf'),fing=$('#mFing'),mh=$('#mHead'),mb=$('#mb'),mbi=$('#mbi'),
 mouth=mh.querySelector('.mw'),eyes=mh.querySelector('.mE'),brows=mh.querySelector('.mB'),pups=[...mh.querySelectorAll('.mP')];
 const D=2000,CX=800,CY=450,TM=1.13,T=6700;
 const grain=[...$('#grain').children].map(p=>{const n=p.getAttribute('d').match(/-?\d+(?:\.\d+)?/g).map(Number);return{x:[n[0],n[2],n[4]],s:p.getAttribute('stroke'),w:p.getAttribute('stroke-width'),o:p.getAttribute('opacity')}});
 // fingers start at the back corner of the door's edge, run over the edge, and finish as nailed tips on the front face (x0 = edge thickness in finger units)
 const fingers=x0=>[[396,44],[421,50],[446,46],[471,36]].map(([y,L])=>{const d=`M${x0},${y-9}L${L-10},${y-8}Q${L+2},${y-7} ${L+2},${y+1}Q${L+2},${y+9} ${L-10},${y+9}L${x0},${y+10}Z`;return`<path d="${d}" transform="translate(3,4)" fill="#000" opacity=".2"/><path d="${d}" fill="url(#fgG)" stroke="#a9764f" stroke-width="1.6" stroke-linejoin="round"/><path d="M0,${y-8}V${y+9}" stroke="#f3cfae" stroke-width="2.5" opacity=".55"/><ellipse cx="${L-9}" cy="${y}" rx="6" ry="4.5" fill="#f0d6c0" stroke="#c9a07c" stroke-width=".8"/><path d="M14,${y-8}Q17,${y} 14,${y+9}" stroke="#b9865f" stroke-width="1.2" fill="none"/>`}).join('');
 const cl=x=>Math.min(1,Math.max(0,x)),sg=(t,a,b)=>cl((t-a)/(b-a)),
  eIO=x=>x<.5?2*x*x:1-Math.pow(2-2*x,2)/2,eO=x=>1-Math.pow(1-x,3),eI=x=>x*x*x,
  eB=x=>1+2.70158*Math.pow(x-1,3)+1.70158*Math.pow(x-1,2),
  pt=p=>p[0].toFixed(1)+','+p[1].toFixed(1);
 // the door leaf is redrawn each frame with a simple perspective swing about its right-hand hinge (x=887); at angle 0 it matches the static door
 const draw=th=>{const c=Math.cos(th),s=Math.sin(th),
   P=(u,v)=>{const f=D/(D-u*s);return[CX+(887-u*c-CX)*f,CY+(v-CY)*f]},
   Q=(u0,v0,u1,v1,at)=>`<polygon points="${[P(u0,v0),P(u1,v0),P(u1,v1),P(u0,v1)].map(pt).join(' ')}" ${at}/>`;
  let h=Q(0,0,397,862,'fill="url(#wood)"');
  h+=grain.map(g=>{const[a,b,e]=[[g.x[0],0],[g.x[1],430],[g.x[2],862]].map(([x,v])=>P(887-x,v));return`<path d="M${pt(a)}Q${pt(b)} ${pt(e)}" stroke="${g.s}" stroke-width="${g.w}" opacity="${g.o}" fill="none"/>`}).join('');
  for(const[x,y,w,hh]of[[528,36,150,270],[700,36,150,270],[528,340,150,440],[700,340,150,440]])
   h+=Q(887-x-w,y,887-x,y+hh,'fill="#c98f3f" stroke="#9a6524" stroke-width="3" stroke-linejoin="round"')+Q(897-x-w,y+10,877-x,y+hh-10,'fill="none" stroke="#e8bd72" stroke-width="2" opacity=".7"');
  h+=Q(0,850,397,862,'fill="#2e1c14"');
  const k=P(377,470),f=D/(D-377*s),a=P(376.5,470.5),b=P(335.5,470.5);

  h+=Q(0,0,397,862,`fill="#1a0d05" opacity="${(.4*Math.pow(s,1.5)).toFixed(3)}"`);
  const e0=P(397,0),e1=P(397,862),w=14*s*D/(D-397*s);
  if(th>.02)h+=`<polygon points="${e0[0]},${e0[1]} ${e1[0]},${e1[1]} ${e1[0]-w},${e1[1]} ${e0[0]-w},${e0[1]}" fill="#b37d36"/>`;
  leaf.innerHTML=h;return[e0[0],c*D/(D-397*s),w]};
 // timeline (ms): creak open -> pause -> swing wide -> head leans out -> speaks -> head back -> door closes
 const th=t=>t<700?.45*eIO(sg(t,0,700)):t<1250?.45+.13*sg(t,700,1250):t<5600?.58+(TM-.58)*eO(sg(t,1250,2150)):TM*(1-eI(sg(t,5600,6500)));
 const frame=t=>{const a=th(t),[xe,sx,ew]=draw(a),k=t<5000?1-eB(sg(t,1700,2450)):eIO(sg(t,5000,5450));
  mh.setAttribute('transform',`translate(${648+130*k},${312+8*k+2*Math.sin(t/420)}) rotate(${-7+18*k+1.2*Math.sin(t/700)} 0 92)`);
  fing.style.display=t>1100&&a>.02?'':'none';if(fing.style.display==='')fing.innerHTML=fingers(-(ew+1)/sx);fing.setAttribute('transform',`translate(${xe},0) scale(${sx.toFixed(3)},1)`)};
 const look=x=>pups.forEach(p=>p.style.transform=`translateX(${x}px)`);
 let busy=0;
 hit.addEventListener('click',()=>{if(busy)return;busy=1;
  const to=(f,ms)=>setTimeout(f,ms);

  to(()=>{mb.style.display='';
   mbi.animate([{transform:'scale(.2)',opacity:0},{transform:'scale(1.12)',opacity:1,offset:.6},{transform:'scale(1)',opacity:1}],{duration:260,easing:'ease-out'});
   for(let i=0;i<5;i++)to(()=>{mouth.animate([{transform:'scaleY(.1)'},{transform:`scaleY(${R(.6,1.2).toFixed(2)})`,offset:.5},{transform:'scaleY(.1)'}],{duration:240,easing:'ease-in-out'})},i*270)},2450);
  to(()=>{mbi.animate([{opacity:1},{opacity:0}],{duration:250,fill:'forwards'}).onfinish=()=>{mb.style.display='none';mbi.getAnimations().forEach(a=>a.cancel())}},4600)})}
